# custom.properties

# Defines a custom property key-value pair
my.prop = Sarbojit

# 🔑 WHAT THIS DOES:
# - Creates a property named "my.prop"
# - Value = "Sarbojit"

# 🔑 HOW IT IS USED IN YOUR CODE:

# Injected using:
# @Value("${my.prop}")

# Example:
# @Value("${my.prop}")
# private String customProperty;

# 👉 Spring reads this file and injects the value into your variable

# 🔑 HOW THIS FILE IS LOADED:

# In your service:
# @PropertySource("classpath:custom.properties")

# 👉 This tells Spring:
# "Load this file from resources folder into Environment"

# 🔑 FLOW:

# custom.properties → Spring Environment → @Value → Java variable

# =========================================================
# 🔥 PROPERTIES vs YAML
# =========================================================

# PROPERTIES (.properties):
# - Flat key-value structure
# - Uses dot notation for hierarchy
# - Example:
#   my.custom.property = hello

# YAML (.yaml / .yml):
# - Hierarchical (nested structure using indentation)
# - More readable for complex configs
# - Example:
#   my:
#     custom:
#       property: hello

# 🔑 KEY DIFFERENCE:

# properties → "my.custom.property"
# yaml       → nested structure (cleaner + easier to read)

# ⚡ Internally:
# Spring converts BOTH into the SAME key-value format

# So:
# my.custom.property (properties)
# =
# my:
#   custom:
#     property (yaml)

# 👉 Both are equivalent to Spring

# =========================================================
# 🧠 WHEN TO USE WHAT
# =========================================================

# Use .properties:
# - Simple configs
# - Small projects

# Use .yaml:
# - Complex/nested configs
# - Large applications (preferred in industry)

# =========================================================
# 🧠 ONE-LINER
# =========================================================

# "YAML is a more readable, hierarchical alternative to properties files, but both are converted into the same key-value format by Spring."