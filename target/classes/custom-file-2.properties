# custom-file-2.properties

# Defines another custom property
my.prop.2 = Sarbojit

# 🔑 WHAT THIS DOES:
# - Creates property: "my.prop.2"
# - Value = "Sarbojit"

# 🔑 HOW IT IS USED IN YOUR CODE:

# Injected using:
# @Value("${my.prop.2}")

# Example:
# @Value("${my.prop.2}")
# private String customProperty2;

# 👉 Spring injects this value into your variable

# 🔑 HOW THIS FILE IS LOADED:

# In your service:
# @PropertySources({
#     @PropertySource("classpath:custom.properties"),
#     @PropertySource("classpath:custom-file-2.properties")
# })

# 👉 Multiple property files can be loaded together

# 🔑 PROPERTY RESOLUTION ORDER (IMPORTANT):

# If same key exists in multiple files:
# → Last loaded file overrides previous ones

# Example:
# custom.properties        → my.prop = A
# custom-file-2.properties → my.prop = B

# 👉 Final value = B (override)

# =========================================================
# 🔥 RELATION TO YAML / APPLICATION FILES
# =========================================================

# Priority (simplified):
# application-{profile}.yaml  (highest)
# application.yaml
# custom properties files (@PropertySource)
# default values

# 👉 Profile-based configs override custom property files

# =========================================================
# ⚠️ ERROR CASE
# =========================================================

# If you use:
# @Value("${my.prop.2}")

# BUT this key is missing:
# ❌ Application fails at startup with:
#    "Could not resolve placeholder 'my.prop.2'"

# =========================================================
# 🧠 ONE-LINER
# =========================================================

# "custom-file-2.properties provides additional external configuration that Spring injects into beans using @Value."